<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Header Gradient -->
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Node & Flow Gradients -->
    <linearGradient id="flow-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="35%" stop-color="#38bdf8" />
      <stop offset="70%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>

    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="accent-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" opacity="0.25" />
      <circle cx="40" cy="40" r="1" fill="#64748b" opacity="0.3" />
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="320" rx="16" fill="url(#bg-grad)" stroke="#1e293b" stroke-width="2" />
  
  <!-- Subtle Background Grid -->
  <rect width="1200" height="320" rx="16" fill="url(#grid)" />

  <!-- Ambient Glow Blobs -->
  <circle cx="150" cy="160" r="100" fill="#22c55e" opacity="0.06" filter="url(#glow)" />
  <circle cx="600" cy="90" r="140" fill="#6366f1" opacity="0.08" filter="url(#glow)" />
  <circle cx="1050" cy="160" r="100" fill="#f43f5e" opacity="0.06" filter="url(#glow)" />

  <!-- BPM Flow Connecting Path -->
  <path d="M 120,160 C 240,75 320,75 420,160 C 520,245 680,245 780,160 C 860,85 960,85 1080,160" 
        fill="none" stroke="url(#flow-grad)" stroke-width="3.5" stroke-linecap="round" filter="url(#soft-glow)" opacity="0.8" />
  
  <!-- Secondary Auxiliary Flow Path -->
  <path d="M 120,160 C 260,260 400,240 500,160 C 600,80 720,80 840,160 C 960,240 1020,220 1080,160" 
        fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6,6" opacity="0.35" />

  <!-- ==================== BPMN DIAGRAM NODES ==================== -->
  
  <!-- 1. Start Event (Green) -->
  <g transform="translate(120, 160)">
    <circle r="28" fill="#22c55e" opacity="0.15" filter="url(#glow)" />
    <circle r="20" fill="#0f172a" stroke="#22c55e" stroke-width="3" />
    <polygon points="-4,-7 8,0 -4,7" fill="#22c55e" />
    <text x="0" y="38" text-anchor="middle" fill="#86efac" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1">START</text>
  </g>

  <!-- 2. Task/Activity Node: Orchestration (Blue/Indigo) -->
  <g transform="translate(420, 160)">
    <rect x="-55" y="-28" width="110" height="56" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="2.5" filter="url(#soft-glow)" />
    <!-- Mini activity badge -->
    <rect x="-47" y="-22" width="16" height="12" rx="2" fill="#0284c7" opacity="0.8" />
    <text x="-39" y="-13" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="bold">⚙</text>
    <text x="5" y="-3" text-anchor="middle" fill="#f0f9ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">Orchestrate</text>
    <text x="0" y="14" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="500">Service Task</text>
  </g>

  <!-- 3. Gateway Node: Decision / Rules (Diamond - Purple) -->
  <g transform="translate(780, 160)">
    <g transform="rotate(45)">
      <rect x="-26" y="-26" width="52" height="52" rx="6" fill="#0f172a" stroke="#c084fc" stroke-width="2.5" filter="url(#soft-glow)" />
    </g>
    <text x="0" y="5" text-anchor="middle" fill="#e9d5ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="bold">✕</text>
    <text x="0" y="44" text-anchor="middle" fill="#d8b4fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1">DECISION</text>
  </g>

  <!-- 4. End Event (Rose/Red) -->
  <g transform="translate(1080, 160)">
    <circle r="28" fill="#f43f5e" opacity="0.15" filter="url(#glow)" />
    <circle r="20" fill="#0f172a" stroke="#f43f5e" stroke-width="5" />
    <circle r="8" fill="#f43f5e" />
    <text x="0" y="38" text-anchor="middle" fill="#fda4af" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1">COMPLETE</text>
  </g>

  <!-- ==================== CENTRAL HERO TEXT & BADGES ==================== -->
  
  <g text-anchor="middle">
    <!-- Top Pill Badge -->
    <g transform="translate(600, 48)">
      <rect x="-160" y="-14" width="320" height="28" rx="14" fill="#1e293b" stroke="#475569" stroke-width="1.2" />
      <circle cx="-138" cy="0" r="4" fill="#38bdf8" />
      <text x="10" y="4" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" letter-spacing="2">CURATED BPM ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text x="600" y="112" fill="url(#primary-grad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="34" font-weight="900" letter-spacing="1" filter="url(#soft-glow)">Awesome Business Process Management</text>

    <!-- Subtitle -->
    <text x="600" y="248" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="500" letter-spacing="0.8">
      Process Orchestration • Workflow Engines • BPMN 2.0 • Case Management • Decision Automation
    </text>

    <!-- Category Highlights Pills -->
    <g transform="translate(600, 282)">
      <text x="0" y="0" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" letter-spacing="0.5">
        🌟 Open Source Suites   |   ☁️ Enterprise SaaS   |   📐 Modeling Toolkits   |   🤖 AI &amp; Low-Code Automation
      </text>
    </g>
  </g>
</svg>
