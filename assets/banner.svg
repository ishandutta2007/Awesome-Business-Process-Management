<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="pulse-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-8px) rotate(3deg); }
      }
      @keyframes floatFast {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-12px) rotate(-3deg); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; r: 24; }
        50% { opacity: 0.85; r: 32; }
      }
      @keyframes dashMove {
        to { stroke-dashoffset: -40; }
      }
      .node-1 { animation: floatSlow 5s ease-in-out infinite; }
      .node-2 { animation: floatFast 6s ease-in-out infinite; }
      .node-3 { animation: floatSlow 7s ease-in-out infinite; }
      .pulse-circle { animation: pulseGlow 3s ease-in-out infinite; }
      .flow-path { stroke-dasharray: 8, 8; animation: dashMove 2s linear infinite; }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="320" rx="16" fill="url(#bg-grad)" stroke="#1e293b" stroke-width="2" />

  <!-- Background Grid Pattern -->
  <g opacity="0.12">
    <path d="M0 40 H1200 M0 80 H1200 M0 120 H1200 M0 160 H1200 M0 200 H1200 M0 240 H1200 M0 280 H1200" stroke="#94a3b8" stroke-width="1" />
    <path d="M80 0 V320 M160 0 V320 M240 0 V320 M320 0 V320 M400 0 V320 M480 0 V320 M560 0 V320 M640 0 V320 M720 0 V320 M800 0 V320 M880 0 V320 M960 0 V320 M1040 0 V320 M1120 0 V320" stroke="#94a3b8" stroke-width="1" />
  </g>

  <!-- BPM Flow Lines (Animated) -->
  <path d="M 120,160 C 240,70 340,70 450,160 C 560,250 680,250 780,160 C 880,70 980,70 1080,160" fill="none" stroke="url(#primary-grad)" stroke-width="3" class="flow-path" filter="url(#glow)" opacity="0.7" />
  
  <path d="M 150,220 C 300,280 480,260 600,160 C 720,60 900,80 1050,120" fill="none" stroke="url(#pulse-grad)" stroke-width="2" class="flow-path" opacity="0.4" />

  <!-- Animated BPM Process Nodes -->
  <!-- Start Event -->
  <g class="node-1" transform="translate(120, 160)">
    <circle r="26" fill="none" stroke="#22c55e" stroke-width="3" opacity="0.4" class="pulse-circle" />
    <circle r="18" fill="#0f172a" stroke="#22c55e" stroke-width="3" />
    <polygon points="-4,-7 7,0 -4,7" fill="#22c55e" />
  </g>

  <!-- Activity / Task Box 1 -->
  <g class="node-2" transform="translate(450, 160)">
    <rect x="-42" y="-24" width="84" height="48" rx="8" fill="#1e1b4b" stroke="#818cf8" stroke-width="2.5" filter="url(#glow)" />
    <text x="0" y="5" text-anchor="middle" fill="#e0e7ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Model</text>
  </g>

  <!-- Decision Gateway -->
  <g class="node-3" transform="translate(780, 160)">
    <rect x="-24" y="-24" width="48" height="48" rx="4" transform="rotate(45)" fill="#312e81" stroke="#c084fc" stroke-width="2.5" filter="url(#glow)" />
    <text x="0" y="5" text-anchor="middle" fill="#f3e8ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold">⚙️</text>
  </g>

  <!-- End Event -->
  <g class="node-1" transform="translate(1080, 160)">
    <circle r="26" fill="none" stroke="#f43f5e" stroke-width="3" opacity="0.4" class="pulse-circle" />
    <circle r="18" fill="#0f172a" stroke="#f43f5e" stroke-width="5" />
    <circle r="7" fill="#f43f5e" />
  </g>

  <!-- Central Title & Typography -->
  <g text-anchor="middle">
    <!-- Tagline Badge -->
    <rect x="440" y="42" width="320" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <text x="600" y="61" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="2">⚡ CURATED BPM ECOSYSTEM</text>

    <!-- Main Title -->
    <text x="600" y="112" fill="url(#primary-grad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" letter-spacing="1.5" filter="url(#glow)">Awesome Business Process Management</text>

    <!-- Subtitle -->
    <text x="600" y="248" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500" letter-spacing="1">
      Process Orchestration • Workflow Engines • BPMN 2.0 • Case Management • Decision Automation
    </text>

    <!-- Feature Pills -->
    <g transform="translate(0, 276)">
      <text x="600" y="0" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">
        🌟 Open Source Suites &nbsp;|&nbsp; ☁️ Enterprise SaaS &nbsp;|&nbsp; 📐 Modeling Toolkits &nbsp;|&nbsp; 🤖 AI &amp; Low-Code Automation
      </text>
    </g>
  </g>
</svg>
